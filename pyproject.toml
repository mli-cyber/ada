[project]
name = "ada"
version = "0.0.1"
description = "Ada (AI-Driven Assistant): a conversational, agentic assistant for personnel, training, and operations data management, built on AWS Bedrock with a Streamlit interface."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.8",
    "strands-agents>=1.40.0",
    "streamlit>=1.48.1",
    "python-dotenv>=1.2.2",
    "chromadb>=0.5.5",
    "pandas>=2.2.0",
    "openpyxl>=3.1.5",
    "pypdf>=6.15.0",
    "pdfplumber>=0.11.10",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "reportlab>=4.2.5",
]

[project.optional-dependencies]
identity = [
    "pyjwt[crypto]>=2.13.0",
]
postgres = [
    "psycopg[binary]>=3.3.4",
]

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pip-audit>=2.10.1",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "types-pyyaml>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ada"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires real AWS credentials/network; excluded by default",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/**/*.py" = ["E402"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
